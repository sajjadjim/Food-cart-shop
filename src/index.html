<body>
    <canvas class="webgl"></canvas>
    
    <!-- Top HUD Navigation -->
    <header class="hud-header">
        <div class="hud-brand">
            <span class="hud-badge-dot"></span>
            <span class="hud-brand-title">🍜 SAJJAD JIM'S RAMEN</span>
        </div>
        <a href="https://github.com/sajjadjim" target="_blank" rel="noopener noreferrer" class="hud-github" title="Visit sajjadjim on GitHub">
            <svg class="github-icon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
            </svg>
            <span class="hud-github-text">github.com/sajjadjim</span>
            <span class="hud-github-arrow">↗</span>
        </a>
    </header>

    <!-- Bottom Instruction Pill -->
    <div class="hud-footer">
        <span class="hud-hint-icon">🕹️</span>
        <span class="hud-hint-text">Click screens & machines to interact • Drag & scroll to explore 3D world</span>
    </div>

    <div class="overlay"></div>
    <div id="cooking">
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div id="area">
            <div id="sides">
                <div id="pan"></div>
                <div id="handle"></div>
            </div>
            <div id="pancake">
                <div id="pastry"></div>
                <div id="pastry2"></div>
                <div id="pastry3"></div>
            </div>
        </div>
        <div class="loading-wrapper">
            <h1 class="loading-title">Cooking Sajjad Jim's Ramen...</h1>
            <div class="loading-bar-container">
                <div class="loading-bar-fill" id="loadingBarFill"></div>
            </div>
            <p class="loading-percentage"><span id="progressPercentage">0</span>%</p>
        </div>
    </div>

    <div class="start-container">
        <button class="start" id="startButton">
            <span class="start-glow"></span>
            <span class="start-text">ENTER RAMEN SHOP</span>
            <span class="start-subtitle">🎧 Sound & 3D Interactive Experience</span>
        </button>
    </div>

</body>
</html>
